<!--
  The macOS install window.

  Builds without a paid Apple developer certificate are quarantined by
  Gatekeeper, and on recent macOS that can show up as "the app is damaged and
  can't be opened" — a sentence that sounds like a corrupted download and sends
  people back to the Releases page to try again.
  The fix is one command, and the only moment we are guaranteed to have the
  user's attention is this window: it opens by itself, before the app has ever
  been launched, which is exactly the point at which the in-app notice cannot
  help because the app cannot start.

  So the instructions live on the background of the drag-to-install window.
  Finder draws four icons on it (electron-builder.yml dmg.contents, 80 px):
  the app and Applications in the top row, the fix script and the PDF guide
  in the second; the artwork leaves their slots and labels clear.
-->
<svg width="660" height="520" viewBox="0 0 660 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="520" fill="#2c2c2c" />

  <!-- Identity, quiet and at the top. -->
  <text x="330" y="40" text-anchor="middle" fill="#f7f7f7" font-family="Ubuntu Sans, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
    font-size="18" font-weight="700">Universal Video Downloader</text>
  <text x="330" y="62" text-anchor="middle" fill="#acacac" font-family="Ubuntu Sans, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
    font-size="13">Drag the app onto Applications</text>

  <!-- Row 1 (icons at y 150): app → Applications. -->
  <path d="M296 150 H364" stroke="#595959" stroke-width="2" stroke-linecap="round" />
  <path d="M356 142 L366 150 L356 158" stroke="#595959" stroke-width="2" stroke-linecap="round"
    stroke-linejoin="round" fill="none" />

  <!-- Between the rows: what the second row is for. -->
  <text x="330" y="236" text-anchor="middle" fill="#ffc252" font-family="Ubuntu Sans, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
    font-size="12.5" font-weight="700">macOS says it is “damaged”? Run the script, or read the guide:</text>

  <!-- Row 2 (icons at y 300): the fix script and the PDF guide. -->

  <rect x="40" y="368" width="580" height="1" fill="#3d3d3d" />
  <text x="40" y="390" fill="#acacac" font-family="Ubuntu Sans, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
    font-size="12">It isn’t damaged: the build has no paid Apple certificate. Or run this once in Terminal:</text>
  <rect x="40" y="402" width="580" height="40" rx="8" fill="#383838" stroke="#4a4a4a" />
  <text x="56" y="427" fill="#f7f7f7" font-family="Ubuntu Sans Mono, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="11.5">xattr -dr com.apple.quarantine "/Applications/Universal Video Downloader.app"</text>
  <text x="40" y="468" fill="#acacac" font-family="Ubuntu Sans, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
    font-size="12">Script blocked too? System Settings › Privacy &amp; Security › Open Anyway.</text>
  <text x="40" y="486" fill="#acacac" font-family="Ubuntu Sans, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
    font-size="12">Needed once per install or update.</text>

  <!--
    There used to be a line here: right-click the app → Open → Open. That only
    ever got past "unidentified developer" on an Intel Mac; it does nothing for
    "damaged", which is what an Apple silicon Mac says, and macOS 15 removed it
    altogether.
  -->
</svg>
