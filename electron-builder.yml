appId: com.denishumen.universalvideodownloader
productName: Universal Video Downloader
copyright: Copyright © 2026 Denis Humen
directories:
  buildResources: build
  output: release/${version}

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!assets/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tailwind.config.js,postcss.config.js}'

# ffmpeg-static ships a per-platform binary that must stay executable on disk.
asarUnpack:
  - resources/**
  - '**/node_modules/ffmpeg-static/**'

win:
  executableName: Universal Video Downloader
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  shortcutName: Universal Video Downloader

mac:
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    NSCameraUsageDescription: This app does not use the camera.
    NSMicrophoneUsageDescription: This app does not use the microphone.

# The install window.
#
# Gatekeeper quarantines unsigned builds and tells the user the app is
# "damaged", which reads like a broken download rather than a policy — so the
# one command that clears it is printed on the window's own background. This is
# the only moment we are sure to be read: it opens by itself, before the app has
# ever run, which is exactly when the notice inside the app cannot help.
#
# `window` must match the size the background is rendered at in
# scripts/generate-icons.mjs, and the icon positions have to stay inside the
# band the artwork leaves clear for them.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  background: build/background.png
  window:
    width: 660
    height: 520
  iconSize: 118
  iconTextSize: 13
  contents:
    - x: 190
      y: 232
      type: file
    - x: 470
      y: 232
      type: link
      path: /Applications

linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: AudioVideo
  maintainer: Denis Humen <dberkut18@gmail.com>
  synopsis: Universal video downloader with automatic stream detection
  description: A beautiful cross-platform desktop app that detects and downloads video streams from almost any website.
  desktop:
    entry:
      Name: Universal Video Downloader
      Categories: AudioVideo;Network;Utility;
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

publish:
  provider: github
  owner: DenisHumen
  repo: Universal-Video-Downloader-
  releaseType: release
