name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag that doesn't match package.json publishes artifacts under the old
  # version number, together with a latest.yml advertising it — so every
  # installed copy compares the version it already has against itself and
  # decides it is up to date. The release exists and nobody ever receives it.
  verify:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture is built on its own machine.
          #
          # `ffmpeg-static` downloads exactly one binary at install time, for
          # the architecture that ran npm — and electron-builder then copies
          # that same node_modules into every target it was asked for. Building
          # `--mac` (arm64 *and* x64) on one Apple Silicon runner therefore put
          # an Apple Silicon ffmpeg inside the Intel disk image, where it fails
          # with "Bad CPU type" on every merge, trim and convert. That is most
          # downloads, since the default format is separate video and audio
          # streams that have to be merged.
          - os: macos-latest
            platform: mac
            args: --arm64
            arch: arm64
            label: mac arm64
          - os: macos-13
            platform: mac
            args: --x64
            arch: x64
            label: mac x64
          - os: ubuntu-latest
            platform: linux
            args: --x64
            arch: x64
            label: linux x64
          - os: windows-latest
            platform: win
            args: --x64
            arch: x64
            label: windows x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      # The guard for the bug described above: read the binary's own header and
      # refuse to package it for a machine it cannot run on.
      - name: Check the bundled ffmpeg matches this architecture
        run: node scripts/check-ffmpeg-arch.mjs --arch=${{ matrix.arch }}

      - name: Typecheck & test
        run: npm run typecheck && npm test

      # CI gates the palette on every push; a release must clear the same bar.
      - name: Contrast gate
        run: npm run check:contrast

      - name: Build renderer & main
        run: npm run build

      - name: Build & publish (${{ matrix.label }})
        run: npx --no-install electron-builder --${{ matrix.platform }} ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple/Windows signing certificates in CI — build unsigned artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # A release page with an empty body is what every release here shipped with:
  # the download badge in the README lands an ordinary person on a bare list of
  # sixteen files, several of which are blockmaps, with nothing saying which one
  # is theirs or what changed. This fills it in from the tag itself.
  #
  # `continue-on-error` on purpose — the binaries are already published and
  # working by this point, and a failure to write prose must never mark a good
  # release as failed.
  notes:
    name: Release notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the release body
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          V="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          {
            echo "### Which file do I need?"
            echo
            echo "| Your computer | Download |"
            echo "| --- | --- |"
            echo "| **Windows 10 / 11** | [Universal-Video-Downloader-$V-windows-x64-setup.exe]($BASE/Universal-Video-Downloader-$V-windows-x64-setup.exe) |"
            echo "| **Mac** with Apple silicon (M1–M4) | [Universal-Video-Downloader-$V-mac-arm64.dmg]($BASE/Universal-Video-Downloader-$V-mac-arm64.dmg) |"
            echo "| **Mac** with an Intel processor | [Universal-Video-Downloader-$V-mac-x64.dmg]($BASE/Universal-Video-Downloader-$V-mac-x64.dmg) |"
            echo "| **Ubuntu / Debian / Mint** | [.deb]($BASE/Universal-Video-Downloader-$V-linux-amd64.deb) or [.AppImage]($BASE/Universal-Video-Downloader-$V-linux-x86_64.AppImage) |"
            echo "| **Fedora / RHEL / openSUSE** | [.rpm]($BASE/Universal-Video-Downloader-$V-linux-x86_64.rpm) |"
            echo
            echo "Not sure which Mac you have? Apple menu → About This Mac. If it says"
            echo "Apple M1, M2, M3 or M4, take the Apple silicon one."
            echo
            echo "### If macOS says the app is damaged"
            echo
            echo "It is not damaged. The app is not signed with a paid Apple developer"
            echo "certificate, so macOS quarantines it. Run this once, in Terminal:"
            echo
            echo '```'
            echo 'xattr -cr "/Applications/Universal Video Downloader.app"'
            echo '```'
            echo
            echo "### What changed"
            echo
          } > body.md

          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log --no-merges --pretty=format:'%s' "$PREV..$TAG" \
              | grep -v '^chore:' \
              | sed 's/^/- /' >> body.md || true
            echo >> body.md
            echo >> body.md
            echo "[Full diff since $PREV](https://github.com/$REPO/compare/$PREV...$TAG)" >> body.md
          else
            echo "- first release" >> body.md
          fi

          gh release edit "$TAG" --repo "$REPO" --notes-file body.md
          echo "--- body written ---"
          cat body.md
