name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The cheap gate: everything that is platform-independent, once.
  check:
    name: Typecheck, test & contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast

  # Packaging, on every platform that ships.
  #
  # This used to run on ubuntu alone, so anything that only breaks on macOS or
  # Windows — a DMG option, an entitlement, an NSIS setting, a path assumption,
  # or an Electron upgrade moving something — first showed up in the release
  # build, which is to say after a `v*` tag was already public and the failure
  # was most expensive to fix. `--dir` skips the installers and is quick.
  #
  # Only the arm64 Mac runs here, not both architectures. macos-13 is scarce
  # enough that the job sat queued for three quarters of an hour without ever
  # starting, which leaves every CI run permanently in progress and the badge in
  # the README with it — a check that never finishes is not a check. macos-latest
  # covers everything mac-specific about packaging: the DMG options, the
  # entitlements, the background image. The one thing that genuinely differs by
  # architecture is the bundled ffmpeg, since `ffmpeg-static` downloads exactly
  # one binary chosen from the host's own arch — and `check:ffmpeg` reads that
  # binary's header on both Mac runners in release.yml, before anything is
  # published.
  pack:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
            arch: x64
            label: linux x64
          - os: windows-latest
            args: --win
            arch: x64
            label: windows x64
          - os: macos-latest
            args: --mac --arm64
            arch: arm64
            label: mac arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The bundled ffmpeg must be able to run on the machine it ships to.
      - name: Check the bundled ffmpeg matches this architecture
        run: node scripts/check-ffmpeg-arch.mjs --arch=${{ matrix.arch }}
      - run: npm run build
      - run: npx --no-install electron-builder --dir ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
