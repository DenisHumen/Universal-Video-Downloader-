name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The cheap gate: everything that is platform-independent, once.
  check:
    name: Typecheck, test & contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast

  # Packaging, on every platform that ships.
  #
  # This used to run on ubuntu alone, so anything that only breaks on macOS or
  # Windows — a DMG option, an entitlement, an NSIS setting, a path assumption,
  # or an Electron upgrade moving something — first showed up in the release
  # build, which is to say after a `v*` tag was already public and the failure
  # was most expensive to fix. `--dir` skips the installers and is quick.
  #
  # Both Mac architectures, on macos-15-intel for x64 rather than the retired
  # macos-13 — that label no longer resolves to a runner, so the job used to
  # queue for ever, every run sat permanently in progress, and the Intel build
  # was quietly coming off the arm64 runner instead. v3.15.0 confirmed the new
  # label really is allocated.
  #
  # Worth the extra job: the Intel Mac is exactly where a packaging bug hid for
  # the entire life of the project, and scripts/after-pack.mjs — which reads the
  # ffmpeg inside each packed app — only helps if something actually packs for
  # that architecture.
  pack:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
            arch: x64
            label: linux x64
          - os: windows-latest
            args: --win
            arch: x64
            label: windows x64
          - os: macos-latest
            args: --mac --arm64
            arch: arm64
            label: mac arm64
          - os: macos-15-intel
            args: --mac --x64
            arch: x64
            label: mac x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ffmpeg-static stops at 6.1.1, which cannot seek into fragmented-MP4 HLS
      # (every trimmed Twitch VOD came out empty). Pinned by URL and SHA-256.
      - name: Replace the bundled ffmpeg with the pinned release
        run: node scripts/fetch-ffmpeg.mjs
      # The bundled ffmpeg must be able to run on the machine it ships to.
      - name: Check the bundled ffmpeg matches this architecture
        run: node scripts/check-ffmpeg-arch.mjs --arch=${{ matrix.arch }}
      - run: npm run build
      - run: npx --no-install electron-builder --dir ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
